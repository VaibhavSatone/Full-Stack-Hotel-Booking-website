<!DOCTYPE html>
{%load static%}
<html lang="en">
  <head>
    <title>hotel booking</title>
    <style>
        :root{
            --maincolor:#0000ff;
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: .3s linear; 
            text-decoration: none;
            text-transform: capitalize;
            outline: none;
        }
        
        html{
            font-size: 62.5%;
        }
        
        .header{
            padding: 1rem 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            background-color: white;
            opacity: 1;
            z-index: 2;
            top: 0;
            right: 0;
            left: 0;
            box-shadow: 0 .5rem .5rem rgba(10, 10, 10, 0.1);
        
        }
        .header #logo img{
            width: 65px;
        }
        
        .header .navbar a{
            font-size: 1.7rem;
            margin-left: 1.5rem;
            color: var(--maincolor);   
        }
        
        .header .navbar a:hover{
           color: orangered;px
        }
        
        .inline{
            display: flex;
        }
        
        .btn{
            
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-left: 2rem;
            padding: 9px 20px 9px 20px;
            font-size: 13px;
        border-radius: 4px;
        background-color: rgba(29, 12, 104, 0.7);
        border: 1px solid rgba(218, 208, 208, 0.3);
        }
        
        .drop a{
            display: block;
            color: white;
            text-decoration: none;
            padding: 0px 9px 0px 8px;
        }
        
        .drop .content{
            display: none;
            position: absolute;
            cursor: pointer;
            padding: 9px 20px 9px 20px;
            margin-left: 2rem;
            font-size: 13px;
        border-radius: 4px;
        background-color: rgba(29, 12, 104, 0.7);
        border: 1px solid rgba(218, 208, 208, 0.3);
        }
        
        .drop:hover .content{
            display: block;
        }
        #sign{
            margin-left: 2rem;
            border-radius: 4px;
            background-color: rgba(29, 12, 104, 0.7);
            border: 1px solid rgba(218, 208, 208, 0.3);
            color: white;
            cursor: pointer;
            padding: 7px 17px 7px 17px;
            font-size: 16px;
            font-weight: 500;
            }
        
         .header button:hover{
                color: orangered;
              }
        .main-background{
            background-image: url(images/bgimg.webp);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.8;
            z-index: -1;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        
        .book-section{
            padding:2rem 9%;
            height: 50vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .inner-book{
            width: 100%;
            background: black;
            display: flex;
          flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .inner-book input{
            padding: 1rem 2rem;
            margin: .5rem 0;
        
        }
        .book-btn{
            padding: 1.1rem 2rem;
            background: var(--maincolor);
        
        }
        .book-btn a{
            color: white;
            font-size: 1.5rem;
        }
        
        .book-section span{
            color: white;
            padding: 0px 6px 0px 6px;
            font-size: 20px;
        }
        .main-hotel{
            padding: 2rem 7%;
            display: flex;
            overflow: hidden;
            white-space: nowrap;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .award-winning-hotel h1{
            color: black;
            font-size: 40px;
            text-align: center;
            padding: 2rem ;
        }
        
        .inner-award{
            flex: 1 1 300px;
        }
        .inner-award h2{
            text-align: center;
            font-size: 30px;
            padding: 1rem;
        }
        
        .inner-award img{
            width: 100%;
        }
        
        .separation{
            height: 8px;
            background-color: rgb(32, 32, 32);
        }
        
        footer{
            color: black;
            max-width: 89vw;
            margin: auto;
            padding: 34px;
        }
        
        footer .que{
            padding: 44px 0;
            font-size: 14px;
        }
        
        .footer{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            color: black;
        }
        
        .footer a{
            font-size: 18px;    
            color: black;
        }
        .ftitem{
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .footer .ftitem a:hover{
            color: orangered;
         }
        
         
            </style>
</head>
<body>
{% block content %}
{% endblock  %}
</body>
</html>
